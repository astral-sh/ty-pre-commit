name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run linters
        run: uv run --locked --only-group=dev prek run --all-files
