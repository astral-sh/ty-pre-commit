name: main
on:
  workflow_dispatch:
    inputs:
      version:
        description: ty version to mirror
        required: false
        type: string

permissions: {}

jobs:
  build:
    name: main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed to push the pull request branch and release tag below

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: set git config
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - run: uv run --no-project mirror.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TY_VERSION: ${{ inputs.version }}

      - name: check for unpushed commits
        id: check_unpushed
        shell: bash
        run: |
          UNPUSHED_COMMITS=$(git log origin/main..HEAD)
          if [ -z "$UNPUSHED_COMMITS" ]; then
            echo "No unpushed commits found."
            echo "changes_exist=false" >> "$GITHUB_ENV"
          else
            echo "Unpushed commits found."
            echo "changes_exist=true" >> "$GITHUB_ENV"

            mapfile -t new_tags < <(git tag --merged HEAD --no-merged origin/main)
            if [ "${#new_tags[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one new tag, found ${#new_tags[@]}. Dispatch one ty version at a time."
              exit 1
            fi

            tag_name="${new_tags[0]}"
            echo "tag_name=$tag_name" >> "$GITHUB_ENV"
            echo "branch_name=mirror-ty-${tag_name#v}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Push pull request branch
        if: env.changes_exist == 'true'
        run: git push origin "HEAD:refs/heads/${branch_name}"

      - name: Create pull request
        if: env.changes_exist == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request_title="Mirror ty ${tag_name#v}"
          printf '%s\n' "Update the pre-commit mirror for ty \`${tag_name#v}\`." > "$RUNNER_TEMP/notes.txt"

          gh pr list --state open --json number,title \
            --jq ".[] | select(.title == \"$pull_request_title\") | .number" | \
            xargs -r -n 1 gh pr close

          pull_request_url="$(gh pr create \
            --base main \
            --head "$branch_name" \
            --title "$pull_request_title" \
            --body-file "$RUNNER_TEMP/notes.txt")"
          echo "pull_request_url=$pull_request_url" >> "$GITHUB_ENV"

      - name: Merge pull request
        if: env.changes_exist == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          gh pr merge "$pull_request_url" --squash --delete-branch
          merge_commit="$(gh pr view "$pull_request_url" --json mergeCommit --jq '.mergeCommit.oid')"
          if [ -z "$merge_commit" ] || [ "$merge_commit" = "null" ]; then
            echo "::error::Pull request did not report a merge commit"
            exit 1
          fi
          echo "merge_commit=$merge_commit" >> "$GITHUB_ENV"

      - name: Push release tag
        if: env.changes_exist == 'true'
        run: |
          git tag --force "$tag_name" "$merge_commit"
          git push origin "refs/tags/${tag_name}"

      - name: create release on new tag if new changes exist
        if: env.changes_exist == 'true'
        run: |
          echo "$tag_name"
          gh release create "$tag_name" \
            --title "$tag_name" \
            --notes "See: https://github.com/astral-sh/ty/releases/tag/${tag_name#v}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
